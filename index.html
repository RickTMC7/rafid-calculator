<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rafid Calculator</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background-color:lightblue;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
}

/* Intro text */
.intro{
    text-align:center;
    margin-bottom:20px;
    color:#000;
    max-width:400px;
}

/* Calculator box */
.calculator{
    background:#ffffff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* Display */
#display{
    width:100%;
    height:50px;
    font-size:22px;
    text-align:right;
    margin-bottom:10px;
    border:none;
    background:black;
    color:white;
    padding:10px;
    border-radius:8px;
}

/* Buttons grid */
.buttons{
    display:grid;
    grid-template-columns:repeat(4,60px);
    gap:10px;
}

/* Buttons */
button{
    height:55px;
    font-size:20px;
    border:none;
    cursor:pointer;
    border-radius:8px;
    background:white;
    transition:0.2s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 10px rgba(0,0,0,0.3);
    .youtube-btn{
    margin-top:20px;
    text-decoration:none;
    background:red;
    color:white;
    padding:15px 25px;
    border-radius:10px;
    font-size:20px;
    transition:0.3s;
}

.youtube-btn:hover{
    background:darkred;
    transform:scale(1.1);
    box-shadow:0 0 20px red;
}
}
</style>
</head>

<body>

<div class="intro">
    <h2>Hi I am Rafid 👋</h2>
    <p>
        This website is made by me. This is the result of my learning HTML for 1 month.  
        I hope you will like it. Thank you ❤️
    </p>
    <hr>
    <hr widht=500>
</div>

<div class="calculator">

<input type="text" id="display" readonly>

<div class="buttons">

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('/')">÷</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="append('*')">×</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="append('-')">−</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="calculate()">=</button>
<button onclick="append('+')">+</button>

<button onclick="clearDisplay()" style="grid-column:span 4;background:#ff4d4d;color:white;">
Clear
</button>

</div>

</div>
<a class="youtube-btn"
href="https://youtube.com/@ricktmc7?si=48evAtnkpVph8NEx"
target="_blank">
🎥 Rafid's Channel
</a>
    <br><br>
<script>
let display=document.getElementById("display");

function append(value){
display.value+=value;
}

function clearDisplay(){
display.value="";
}

function calculate(){
try{
display.value=eval(display.value);
}catch{
display.value="Error";
}
}
</script>

</body>
</html>
